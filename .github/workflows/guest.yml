name: Guest (minimal Linux)

# 最小ゲスト（カーネル＋agent）をビルドし、QEMU で起動してゴールデンテストを流す（Issue #15, #17, #18）。
# できた Image は成果物として残す。arm64 は Mac（mac/run-golden.sh）、x86_64 は Windows（windows/run-golden.ps1）で使う。
on:
  push:
    branches: [feature/kernel-portability]
    paths:
      - 'guest/**'
      - 'scripts/golden/**'
      - 'test/golden/**'
      - '.github/workflows/guest.yml'
  pull_request:
    paths:
      - 'guest/**'
      - 'scripts/golden/**'
      - 'test/golden/**'
      - '.github/workflows/guest.yml'
  workflow_dispatch:

jobs:
  # agent の命令の形 v1 の単体テスト（guest/agent/agent_test.go、#12）。本物の OverlayFS を mount するので root で流す。
  # GitHub の Ubuntu では非特権のユーザー名前空間が AppArmor で止められているため、テストの実行ファイルを作って sudo で動かす。
  agent-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: guest/agent/go.mod
          cache: false
      - name: Vet
        working-directory: guest/agent
        run: go vet ./...
      - name: Test as root (mounts OverlayFS)
        working-directory: guest/agent
        run: |
          go test -c -o "$RUNNER_TEMP/agent.test" .
          sudo "$RUNNER_TEMP/agent.test" -test.v

  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            packages: gcc-aarch64-linux-gnu qemu-system-arm
            # hvc0（カーネルのログ）はファイルへ、名前付きポート "microgit" は QEMU の stdin/stdout へ
            qemu: >-
              qemu-system-aarch64 -M virt -cpu max -smp 1 -m 256
          - arch: x86_64
            packages: qemu-system-x86
            qemu: >-
              qemu-system-x86_64 -M q35 -cpu max -smp 1 -m 256
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: guest/agent/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libelf-dev xz-utils ${{ matrix.packages }}

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: guest/.cache/*.tar.xz
          key: linux-${{ hashFiles('guest/kernel/version.env') }}

      - name: Build guest
        run: ARCH=${{ matrix.arch }} guest/build.sh

      - name: Boot in QEMU and run golden scenarios
        run: |
          out=guest/out/${{ matrix.arch }}
          node scripts/golden/check-guest.mjs --json $out/guest-result.json -- \
            ${{ matrix.qemu }} \
              -nodefaults -display none -no-reboot \
              -kernel $out/Image -append "console=hvc0" \
              -device virtio-serial-pci \
              -chardev file,id=con,path=$out/console.log \
              -device virtconsole,chardev=con \
              -chardev stdio,id=proto,signal=off \
              -device virtserialport,chardev=proto,name=microgit

      - name: Guest console log
        if: always()
        run: cat guest/out/${{ matrix.arch }}/console.log || true

      # 補足 S-3 の確認: GitHub の Ubuntu 24.04 で非特権ユーザー名前空間が使えるか（失敗しても止めない）
      - name: Probe unprivileged user namespaces (S-3)
        if: always() && matrix.arch == 'arm64'
        continue-on-error: true
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          if unshare -Urm true; then echo "unprivileged userns: allowed"; else echo "unprivileged userns: blocked"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microgit-guest-${{ matrix.arch }}
          path: |
            guest/out/${{ matrix.arch }}/Image
            guest/out/${{ matrix.arch }}/config
            guest/out/${{ matrix.arch }}/sizes.txt
            guest/out/${{ matrix.arch }}/console.log
            guest/out/${{ matrix.arch }}/guest-result.json
          if-no-files-found: warn
